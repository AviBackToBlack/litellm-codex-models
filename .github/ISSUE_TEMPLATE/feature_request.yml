name: Feature request
description: Propose a mapping, compatibility, CLI, or packaging improvement
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What limitation or workflow problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Relevant Codex / LiteLLM evidence
      description: Link public upstream schema/docs/issues where possible. Redact private infrastructure details.
