version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: ["dependencies", "github-actions"]
    groups:
      minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    labels: ["dependencies", "python"]
    groups:
      minor-patch:
        update-types: ["minor", "patch"]
