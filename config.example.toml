# Ordered exact allowlist. Only these LiteLLM model_name values are emitted.
models = [
  "gpt-5.6-sol",
  "claude_code.gpt-5.6-sol",
  "claude-sonnet-5",
]

[filter]
strict = true

[litellm]
url = "https://litellm.example.com"
api_key_env = "LITELLM_API_KEY"
endpoint = "/v1/model/info"
timeout_seconds = 30

[codex]
binary = "codex"
version = "auto"
# Optional explicit override:
# ref = "rust-v0.153.0"

[output]
path = "models.json"
pretty = true
